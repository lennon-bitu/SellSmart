{% extends 'base/base.html' %}

{% block title %}
  Confirmar Exclusão
{% endblock %}

{% block content %}
<div class="container-fluid">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card">
        <div class="card-header">
          <h3 class="card-title">Confirmar Exclusão</h3>
        </div>
        <div class="card-body">
          <p>Tem certeza que deseja excluir o tipo de transação "<strong>{{ transaction_type.name }}</strong>"?</p>
          <p>Esta ação não poderá ser desfeita.</p>
          
          <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Confirmar Exclusão</button>
            <a href="{% url 'financial_control:transaction_type_list' %}" class="btn btn-secondary">Cancelar</a>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
